services:
  web:
    build: .
    # 两个工作进程共用卷里的同一个 SQLite 文件（WAL），验证多进程并发核实。
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "2"]
    ports:
      - "8000:8000"
    environment:
      PM_DB_PATH: /data/plusminus.db
    volumes:
      - pm-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/games')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pm-data:
